# Author: Viquar Khan (ORCID 0009-0008-3592-4162). Part of the Fulcrum / RVx project.
# Uses AWS pseudo-parameters (AWS::AccountId, AWS::Region); no account id is hardcoded.
AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Fulcrum RVx CI/CD pipeline. CodeCommit source -> Build (validate template) -> Deploy
  (CloudFormation app stack) -> Validate (RVx gate on real Lambda). All roles are scoped
  to fulcrum-rvx-* resources. No GitHub; source lives in AWS CodeCommit.

Parameters:
  ProjectName: { Type: String, Default: fulcrum-rvx }
  RepoName:    { Type: String, Default: fulcrum-rvx-validation }
  BranchName:  { Type: String, Default: main }

Resources:

  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-artifacts-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256}
      VersioningConfiguration: { Status: Enabled }

  # ---- CloudFormation deploy role: manages only the app stack's resource types ----
  CfnDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-cfn-deploy'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: cloudformation.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: manage-app-resources
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [lambda:CreateFunction, lambda:DeleteFunction, lambda:UpdateFunctionCode,
                         lambda:UpdateFunctionConfiguration, lambda:GetFunction, lambda:GetFunctionConfiguration,
                         lambda:ListVersionsByFunction, lambda:TagResource, lambda:UntagResource,
                         lambda:AddPermission, lambda:RemovePermission]
                Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${ProjectName}-*'
              - Effect: Allow
                Action: [iam:CreateRole, iam:DeleteRole, iam:GetRole, iam:PassRole, iam:PutRolePolicy,
                         iam:DeleteRolePolicy, iam:GetRolePolicy, iam:TagRole, iam:UntagRole,
                         iam:ListRolePolicies, iam:ListAttachedRolePolicies]
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/${ProjectName}-*'

  # ---- CodeBuild role for BUILD (template validation only) ----
  BuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-build'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: codebuild.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: build-perms
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${ProjectName}-*'
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion, s3:PutObject, s3:GetBucketAcl, s3:GetBucketLocation]
                Resource: [!GetAtt ArtifactBucket.Arn, !Sub '${ArtifactBucket.Arn}/*']
              - Effect: Allow
                Action: cloudformation:ValidateTemplate
                Resource: '*'   # ValidateTemplate does not support resource-level permissions

  # ---- CodeBuild role for VALIDATE (invoke + read-only outcomes) ----
  ValidateRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-validate'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: codebuild.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: validate-perms
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${ProjectName}-*'
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion]
                Resource: !Sub '${ArtifactBucket.Arn}/*'
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${ProjectName}-*'
              - Effect: Allow
                Action: [cloudwatch:GetMetricData]
                Resource: '*'   # GetMetricData does not support resource-level permissions
              - Effect: Allow
                Action: sts:GetCallerIdentity
                Resource: '*'

  BuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${ProjectName}-build'
      ServiceRole: !GetAtt BuildRole.Arn
      Artifacts: { Type: CODEPIPELINE }
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
      Source:
        Type: CODEPIPELINE
        BuildSpec: |
          version: 0.2
          phases:
            build:
              commands:
                - echo "Validating CloudFormation template..."
                - aws cloudformation validate-template --template-body file://app-stack.yaml
                - echo "Template OK"
          artifacts:
            files:
              - '**/*'

  ValidateProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${ProjectName}-validate'
      ServiceRole: !GetAtt ValidateRole.Arn
      Artifacts: { Type: CODEPIPELINE }
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
      Source:
        Type: CODEPIPELINE
        BuildSpec: |
          version: 0.2
          phases:
            build:
              commands:
                - echo "Running Fulcrum RVx validation gate on real Lambda..."
                - python3 validate_gate.py
          artifacts:
            files:
              - aws_validation_report.json

  # ---- CodePipeline role ----
  PipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-pipeline'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: codepipeline.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: pipeline-perms
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion, s3:PutObject, s3:GetBucketAcl, s3:GetBucketLocation]
                Resource: [!GetAtt ArtifactBucket.Arn, !Sub '${ArtifactBucket.Arn}/*']
              - Effect: Allow
                Action: [codecommit:GetBranch, codecommit:GetCommit, codecommit:UploadArchive,
                         codecommit:GetUploadArchiveStatus, codecommit:CancelUploadArchive, codecommit:GetRepository]
                Resource: !Sub 'arn:aws:codecommit:${AWS::Region}:${AWS::AccountId}:${RepoName}'
              - Effect: Allow
                Action: [codebuild:StartBuild, codebuild:BatchGetBuilds]
                Resource: [!GetAtt BuildProject.Arn, !GetAtt ValidateProject.Arn]
              - Effect: Allow
                Action: [cloudformation:CreateStack, cloudformation:UpdateStack, cloudformation:DescribeStacks,
                         cloudformation:DescribeStackEvents, cloudformation:GetTemplate, cloudformation:CreateChangeSet,
                         cloudformation:ExecuteChangeSet, cloudformation:DescribeChangeSet, cloudformation:DeleteChangeSet]
                Resource: !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${ProjectName}-app/*'
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CfnDeployRole.Arn

  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub '${ProjectName}-pipeline'
      RoleArn: !GetAtt PipelineRole.Arn
      ArtifactStore: { Type: S3, Location: !Ref ArtifactBucket }
      Stages:
        - Name: Source
          Actions:
            - Name: Source
              ActionTypeId: { Category: Source, Owner: AWS, Provider: CodeCommit, Version: '1' }
              Configuration:
                RepositoryName: !Ref RepoName
                BranchName: !Ref BranchName
                PollForSourceChanges: 'false'
              OutputArtifacts: [{ Name: SourceOutput }]
        - Name: Build
          Actions:
            - Name: ValidateTemplate
              ActionTypeId: { Category: Build, Owner: AWS, Provider: CodeBuild, Version: '1' }
              Configuration: { ProjectName: !Ref BuildProject }
              InputArtifacts: [{ Name: SourceOutput }]
              OutputArtifacts: [{ Name: BuildOutput }]
        - Name: Deploy
          Actions:
            - Name: DeployAppStack
              ActionTypeId: { Category: Deploy, Owner: AWS, Provider: CloudFormation, Version: '1' }
              Configuration:
                ActionMode: CREATE_UPDATE
                StackName: !Sub '${ProjectName}-app'
                Capabilities: CAPABILITY_NAMED_IAM
                RoleArn: !GetAtt CfnDeployRole.Arn
                TemplatePath: SourceOutput::app-stack.yaml
              InputArtifacts: [{ Name: SourceOutput }]
        - Name: Validate
          Actions:
            - Name: RVxGate
              ActionTypeId: { Category: Build, Owner: AWS, Provider: CodeBuild, Version: '1' }
              Configuration: { ProjectName: !Ref ValidateProject }
              InputArtifacts: [{ Name: SourceOutput }]

  # ---- EventBridge: trigger the pipeline on every push to the branch ----
  PipelineTriggerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-trigger'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: start-pipeline
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: codepipeline:StartPipelineExecution
                Resource: !Sub 'arn:aws:codepipeline:${AWS::Region}:${AWS::AccountId}:${ProjectName}-pipeline'

  PipelineTriggerRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${ProjectName}-on-commit'
      EventPattern:
        source: [aws.codecommit]
        detail-type: ['CodeCommit Repository State Change']
        resources: [!Sub 'arn:aws:codecommit:${AWS::Region}:${AWS::AccountId}:${RepoName}']
        detail:
          event: [referenceCreated, referenceUpdated]
          referenceName: [!Ref BranchName]
      Targets:
        - Arn: !Sub 'arn:aws:codepipeline:${AWS::Region}:${AWS::AccountId}:${ProjectName}-pipeline'
          Id: pipeline
          RoleArn: !GetAtt PipelineTriggerRole.Arn

Outputs:
  PipelineName: { Value: !Ref Pipeline }
  RepoCloneUrl:
    Value: !Sub 'https://git-codecommit.${AWS::Region}.amazonaws.com/v1/repos/${RepoName}'
